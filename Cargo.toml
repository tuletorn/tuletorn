[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/proxy-hyper",
    "crates/proxy-pingora",
    "crates/proxy-monoio",
    "crates/bench",
]

[workspace.dependencies]
tokio = { version = "1.53.1", features = ["full", "parking_lot"] }
hyper = { version = "1.11.0", features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "0.1.20", features = ["server-auto", "client-legacy", "tokio", "http1", "http2"] }
http-body-util = "0.1.5"
bytes = "1.12.1"
matchit = "0.9.2"
arc-swap = "1.9.2"
kube = { version = "4.2", features = ["runtime", "derive", "client"] }
k8s-openapi = { version = "0.28", features = ["latest"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.0", features = ["trace", "timeout", "cors"] }
rustls = "0.23"
tokio-rustls = "0.26.4"
simdutf8 = { version = "0.1.5", features = ["aarch64_neon"] }
memchr = "2.8.3"
httparse = "1.10.1"
tikv-jemallocator = "0.7.0"
mimalloc = { version = "0.1.52", features = ["local_dynamic_tls"] }
crossbeam-utils = "0.8.22"
hdrhistogram = "7.6.0"
sysinfo = "0.39.6"
criterion = { version = "0.8.2", features = ["html_reports"] }
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }

http = "1.5"
pingora-core = "0.8.1"
pingora-proxy = "0.8.1"
pingora-load-balancing = "0.8.1"
pingora-http = "0.8.1"
monoio = { version = "0.2.4", features = ["macros", "poll-io", "iouring", "legacy"] }

num_cpus = "1.17"
futures-util = "0.3"
parking_lot = "0.12"
anyhow = "1.0"
thiserror = "2.0"
reqwest = { version = "0.13", features = ["json", "stream"] }
async-trait = "0.1"
rand = "0.10"
socket2 = { version = "0.6", features = ["all"] }
route-recognizer = "0.3"

# ---------------------------------------------------------------------------
# Build profiles (plan §2 / §4)
# ---------------------------------------------------------------------------

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = false
debug = false

# Identical codegen to `release`, but keeps symbols + line tables so that
# `perf` / `dtrace` flamegraphs (plan §5) and `llvm-bolt` (plan §4.3) work.
# `strip = "symbols"` on the release profile makes both impossible.
[profile.profiling]
inherits = "release"
debug = 1
strip = "none"
split-debuginfo = "off"

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 1
