[package]
name = "lb-proxy-native"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Completion-native io_uring HTTP/1.1 reverse proxy: no async runtime, no poll adapter"

[[bin]]
name = "lb-proxy-native"
path = "src/main.rs"

[dependencies]
lb-core = { path = "../core" }
io-uring = "0.6.4"
libc = "0.2"
httparse = "1.10.1"
clap.workspace = true
num_cpus.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
tikv-jemallocator.workspace = true
