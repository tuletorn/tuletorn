# Traefik v3.7.12 baseline (plan §1, §7.1).
#
# Resource requests and limits are identical to the Rust candidates in
# k8s/rust-proxies/, and pprof is enabled so plan §5 can capture a Go
# flamegraph alongside the Rust ones.
apiVersion: v1
kind: Namespace
metadata:
  name: traefik
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: traefik
  namespace: traefik
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: traefik
rules:
  - apiGroups: [""]
    resources: ["services", "secrets", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gatewayclasses", "gateways", "httproutes", "grpcroutes", "referencegrants", "tcproutes", "tlsroutes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gatewayclasses/status", "gateways/status", "httproutes/status", "grpcroutes/status", "tcproutes/status", "tlsroutes/status"]
    verbs: ["update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: traefik
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: traefik
subjects:
  - kind: ServiceAccount
    name: traefik
    namespace: traefik
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
  namespace: traefik
  labels:
    app: traefik
    lb-bench/candidate: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traefik
  template:
    metadata:
      labels:
        app: traefik
    spec:
      serviceAccountName: traefik
      containers:
        - name: traefik
          image: traefik:v3.7.12
          args:
            - --entrypoints.web.address=:80
            - --providers.kubernetesgateway=true
            - --providers.kubernetesgateway.experimentalchannel=false
            - --api.insecure=true
            - --api.dashboard=false
            # Enables /debug/pprof on the admin entrypoint (plan §5).
            - --api.debug=true
            - --ping=true
            - --log.level=ERROR
            - --accesslog=false
            - --metrics.prometheus=true
          env:
            # Give the Go runtime the same CPU budget as the cgroup limit
            # below. Without this, GOMAXPROCS defaults to the *host's* core
            # count and the Go scheduler oversubscribes its own quota, which
            # shows up as throttling rather than as a property of Traefik.
            - name: GOMAXPROCS
              value: "4"
            # Match the container memory limit so the GC targets the right
            # heap ceiling instead of the node's total memory.
            - name: GOMEMLIMIT
              value: "1800MiB"
          ports:
            - name: web
              containerPort: 80
            - name: admin
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ping
              port: 8080
            initialDelaySeconds: 1
            periodSeconds: 2
          resources:
            requests:
              cpu: "4000m"
              memory: "256Mi"
            limits:
              cpu: "4000m"
              memory: "2Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: traefik
  namespace: traefik
spec:
  type: NodePort
  selector:
    app: traefik
  ports:
    - name: web
      port: 80
      targetPort: 80
      nodePort: 30000
    - name: admin
      port: 8080
      targetPort: 8080
      nodePort: 30009
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: traefik
spec:
  controllerName: traefik.io/gateway-controller
