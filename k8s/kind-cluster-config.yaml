# Pinned per plan §7.1: kind v0.32.0 / kindest/node v1.31.6.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: lb-bench
nodes:
  - role: control-plane
    image: kindest/node:v1.31.6
    kubeadmConfigPatches:
      # Raise the pod-per-node cap: the connection-density scenario runs
      # multi-replica backends alongside four candidate deployments.
      - |
        kind: KubeletConfiguration
        maxPods: 250
    extraPortMappings:
      # Traefik baseline.
      - containerPort: 30000
        hostPort: 8000
        protocol: TCP
      # Rust candidates, matching the nodePorts in k8s/rust-proxies/.
      - containerPort: 30001
        hostPort: 8001
        protocol: TCP
      - containerPort: 30002
        hostPort: 8002
        protocol: TCP
      - containerPort: 30003
        hostPort: 8003
        protocol: TCP
      # Traefik's pprof/admin endpoint, for Go flamegraph capture (plan §5).
      - containerPort: 30009
        hostPort: 8009
        protocol: TCP
